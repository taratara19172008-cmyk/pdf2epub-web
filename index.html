<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f4">
  <meta name="description" content="在浏览器本地把 PDF 转换为 Apple Books 可打开的 EPUB。">
  <title>PDF 转 EPUB · 纸间</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a31;
      --muted: #687b7f;
      --line: #dce6e3;
      --teal: #147d75;
      --teal-dark: #0d625e;
      --mint: #e1f1ed;
      --paper: #fbfcfa;
      --bg: #f1f5f2;
      --amber: #c77b31;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 90% 0%, rgba(190, 225, 215, .42), transparent 36rem),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      width: min(100% - 32px, 600px);
      margin: 0 auto;
      padding: max(26px, env(safe-area-inset-top)) 0 max(30px, env(safe-area-inset-bottom));
    }
    .brand { display: flex; align-items: center; gap: 11px; margin: 4px 2px 28px; }
    .brand-mark {
      display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto;
      border-radius: 14px; color: white; background: var(--teal);
      box-shadow: 0 7px 18px rgba(20, 125, 117, .2);
    }
    .brand-name { font-size: 15px; font-weight: 720; letter-spacing: .04em; }
    .brand-note { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .intro { margin: 0 2px 23px; }
    h1 { margin: 0; font-size: clamp(29px, 8vw, 38px); line-height: 1.17; letter-spacing: -.045em; font-weight: 760; }
    .intro p { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .card {
      padding: 20px; border: 1px solid rgba(207, 222, 217, .9); border-radius: 22px;
      background: rgba(251, 252, 250, .94); box-shadow: 0 12px 36px rgba(34, 71, 65, .055);
    }
    .section-title { display: flex; align-items: center; gap: 9px; margin: 0 0 13px; font-size: 14px; font-weight: 700; }
    .step { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 8px; color: var(--teal-dark); background: var(--mint); font-size: 11px; font-weight: 750; }
    .file-picker {
      display: flex; align-items: center; gap: 13px; min-height: 76px; padding: 14px;
      border: 1px dashed #a9c4bd; border-radius: 15px; background: #f7fbf9; cursor: pointer;
      transition: border-color .16s, background .16s;
    }
    .file-picker:focus-within, .file-picker:hover { border-color: var(--teal); background: #f1f9f6; }
    .file-icon { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 13px; color: var(--teal-dark); background: var(--mint); }
    .file-copy { min-width: 0; flex: 1; }
    .file-main { display: block; overflow: hidden; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .file-sub { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    input[type="file"] { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    .divider { height: 1px; margin: 20px 0; background: #e9efed; }
    .modes { display: grid; gap: 9px; }
    .mode {
      display: flex; align-items: flex-start; gap: 11px; padding: 13px 12px;
      border: 1px solid var(--line); border-radius: 14px; cursor: pointer; background: #fff;
      transition: border-color .16s, background .16s, box-shadow .16s;
    }
    .mode:has(input:checked) { border-color: #61a99f; background: #f4faf7; box-shadow: 0 0 0 2px rgba(20, 125, 117, .08); }
    .mode input { width: 17px; height: 17px; margin: 2px 0 0; flex: 0 0 auto; accent-color: var(--teal); }
    .mode-title { display: block; font-size: 13px; font-weight: 680; }
    .mode-desc { display: block; margin-top: 4px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
    .mode-tag { margin-left: auto; padding: 4px 7px; border-radius: 7px; color: #5e7773; background: #edf4f1; font-size: 10px; white-space: nowrap; }
    .quality-wrap { margin-top: 13px; }
    .quality-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 650; }
    .quality-select { width: 100%; min-height: 43px; padding: 0 11px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: #fff; font: inherit; font-size: 12px; }
    .quality-note { margin: 6px 1px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .primary, .download {
      display: flex; width: 100%; min-height: 51px; align-items: center; justify-content: center; gap: 9px;
      margin-top: 18px; border: 0; border-radius: 14px; color: #fff; background: var(--teal);
      font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent;
      text-align: center; text-decoration: none;
      transition: background .16s, transform .12s, opacity .16s;
    }
    .primary:active, .download:active { transform: scale(.99); }
    .primary:hover, .download:hover { background: var(--teal-dark); }
    .primary:disabled, .download[aria-disabled="true"] { cursor: not-allowed; opacity: .43; }
    .download[aria-disabled="true"] { pointer-events: none; }
    .download { margin-top: 11px; color: var(--teal-dark); border: 1px solid #a5ccc3; background: #eff8f4; }
    .download:hover { background: #e4f3ed; }
    .primary:focus-visible, .download:focus-visible, .quality-select:focus-visible { outline: 3px solid rgba(20, 125, 117, .3); outline-offset: 2px; }
    .progress-wrap { margin-top: 18px; padding: 14px; border-radius: 14px; background: #f4f8f6; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .progress-pct { color: var(--teal-dark); font-variant-numeric: tabular-nums; font-weight: 700; }
    .progress-track { height: 7px; margin-top: 10px; overflow: hidden; border-radius: 10px; background: #dfeae6; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1b8b80, #63b6a2); transition: width .2s ease; }
    .status { min-height: 18px; margin: 11px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .status.error { color: #a84638; }
    .hint {
      display: flex; gap: 10px; margin: 16px 2px 0; padding: 0 2px; color: var(--muted);
      font-size: 11.5px; line-height: 1.6;
    }
    .hint svg { flex: 0 0 auto; margin-top: 1px; color: var(--teal); }
    .foot { margin: 22px 2px 0; color: #82908f; font-size: 10.5px; text-align: center; }
    [hidden] { display: none !important; }
    @media (min-width: 520px) { .shell { padding-top: 38px; } .card { padding: 23px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
  <script defer src="vendor/pdfjs.bundle.js"></script>
  <script defer src="vendor/jszip.min.js"></script>
  <script defer src="converter-core.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="brand" aria-label="纸间 PDF 转 EPUB">
      <span class="brand-mark" aria-hidden="true">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M6 3.75h8.1L19 8.7v11.55H6a1.75 1.75 0 0 1-1.75-1.75V5.5A1.75 1.75 0 0 1 6 3.75Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.75 4v5h5M8 13h8M8 16.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span><span class="brand-name">纸间 · PDF 转 EPUB</span><span class="brand-note">本地转换 · 文件不上传</span></span>
    </header>

    <section class="intro">
      <h1>把 PDF，装进<br>一本 EPUB 里。</h1>
      <p>在浏览器本地完成转换，生成的电子书可导入 Apple Books。</p>
    </section>

    <section class="card" aria-label="PDF 转换设置">
      <h2 class="section-title"><span class="step">1</span>选择 PDF 文件</h2>
      <label class="file-picker" for="pdf-file">
        <span class="file-icon" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="file-copy"><span class="file-main" id="file-name">点此选择 PDF</span><span class="file-sub" id="file-info">支持从“文件”App 选择文稿</span></span>
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" style="color:#829692"><path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <input id="pdf-file" type="file" accept="application/pdf,.pdf">

      <div class="divider"></div>

      <h2 class="section-title"><span class="step">2</span>选择转换方式</h2>
      <div class="modes">
        <label class="mode">
          <input type="radio" name="mode" value="layout" checked>
          <span><span class="mode-title">保留原版面</span><span class="mode-desc">每页转为清晰图片，适合扫描件、图表和复杂排版。</span></span>
          <span class="mode-tag">版式优先</span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="text">
          <span><span class="mode-title">提取文字重排</span><span class="mode-desc">提取可选中的文字，适合纯文字 PDF，可调整阅读字号。</span></span>
          <span class="mode-tag">文字优先</span>
        </label>
      </div>

      <div class="quality-wrap" id="layout-quality-wrap">
        <label class="quality-label" for="layout-quality">原版面图片清晰度</label>
        <select class="quality-select" id="layout-quality">
          <option value="balanced" selected>均衡 · 最长边上限约 1200 px · JPEG 68%</option>
          <option value="high">清晰 · 最长边上限约 1500 px · JPEG 78%</option>
          <option value="compact">省空间 · 最长边上限约 950 px · JPEG 58%</option>
        </select>
        <p class="quality-note">清晰度越低，生成的 EPUB 通常越小；此设置只影响“保留原版面”。</p>
      </div>

      <button class="primary" id="convert" type="button" disabled>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3.5v17M3.5 12h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>开始转换</span>
      </button>

      <div class="progress-wrap" id="progress-wrap" hidden>
        <div class="progress-row"><span id="progress-label">准备转换…</span><span class="progress-pct" id="progress-pct">0%</span></div>
        <div class="progress-track" role="progressbar" aria-label="转换进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></p>

      <button class="primary" id="share-epub" type="button" disabled>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="share-label">分享并保存 EPUB · iPhone 选择“图书”</span>
      </button>
      <a class="download" id="direct-download" aria-disabled="true" tabindex="-1" target="_blank" rel="noopener" download>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 16v2.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>直接下载 EPUB</span>
      </a>
      <div class="hint">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 19 6v5.1c0 4.6-3 7.8-7 9.4-4-1.6-7-4.8-7-9.4V6l7-2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>PDF 与 EPUB 都只在此设备处理。分享失败时会自动尝试下载；iPhone 上可在“文件”App 找到 EPUB，再用分享菜单选择“图书”，也可随时点“直接下载 EPUB”。</span>
      </div>
    </section>
    <p class="foot">纸间 · 为安静阅读而做</p>
  </main>
</body>
</html>
